; Mirror of the llama-models.ini generated by relms/flake systems/llama.nix (rerank model only).
; Keep in sync with that file. {model} is replaced by compare-jina-rerank.py run.
version=1

[*]
cache-ram=0
cache-type-k=q8_0
cache-type-v=q8_0
cont-batching=true
flash-attn=on
kv-unified=true
kv-unified-per-slot=8192
load-mode=mmap
load-on-startup=false
n-gpu-layers=99
sleep-idle-seconds=900
stop-timeout=30

[hf.co/jinaai/jina-reranker-v3.5-GGUF:Q8_0]
attention=causal
batch-size=8192
embedding=true
model={model}
parallel=2
pooling=none
ubatch-size=1024
